<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${brand}">Compra</title>
</head>
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;border:1px solid #e5e7eb;">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:24px;color:#111827;font-size:15px;line-height:1.5;">
        <h2 style="margin:0 0 8px;">¡Compra confirmada!</h2>
        <p style="margin:0 0 16px;">Hola, tu compra con el NIT <strong th:text="${customerNit}">1234567</strong> quedó confirmada.</p>

        <table style="width:100%;border-collapse:collapse;margin-bottom:16px;">
            <tr>
                <td style="padding:6px 0;color:#6b7280;width:90px;">Viaje</td>
                <td style="padding:6px 0;font-weight:600;" th:text="${origin} + ' → ' + ${destination}">Origen → Destino</td>
            </tr>
            <tr>
                <td style="padding:6px 0;color:#6b7280;">Salida</td>
                <td style="padding:6px 0;" th:text="${departure}">domingo 25 de octubre de 2026, 06:00</td>
            </tr>
            <tr>
                <td style="padding:6px 0;color:#6b7280;">Bus</td>
                <td style="padding:6px 0;" th:text="${busPlate}">C123ABC</td>
            </tr>
            <tr>
                <td style="padding:6px 0;color:#6b7280;">Orden</td>
                <td style="padding:6px 0;" th:text="${orderCode}">A1B2C3D4</td>
            </tr>
        </table>

        <h3 style="margin:0 0 8px;font-size:16px;">Tus asientos</h3>
        <table style="width:100%;border-collapse:collapse;">
            <tr th:each="line : ${tickets}">
                <td style="padding:8px 0;border-bottom:1px solid #e5e7eb;">Asiento <strong th:text="${line.seat}">1A</strong></td>
                <td style="padding:8px 0;border-bottom:1px solid #e5e7eb;text-align:right;" th:text="${line.price}">Q 85.00</td>
            </tr>
            <tr>
                <td style="padding:10px 0;font-weight:700;">Total</td>
                <td style="padding:10px 0;font-weight:700;text-align:right;" th:text="${total}">Q 85.00</td>
            </tr>
        </table>

        <p style="margin:16px 0 0;color:#6b7280;font-size:13px;">
            Pagado con tu cartera el <span th:text="${paymentDate}">25/10/2026</span>.
        </p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
