<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${heading}">Aviso</title>
</head>
<body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;border:1px solid #e5e7eb;">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:24px;color:#111827;font-size:15px;line-height:1.5;">
        <h2 th:style="'margin:0 0 12px;padding-left:10px;border-left:4px solid ' + ${accent}"
            th:text="${heading}">Título</h2>
        <p style="margin:0 0 16px;" th:text="${intro}">Texto principal.</p>

        <table th:if="${rows != null and !#lists.isEmpty(rows)}" style="width:100%;border-collapse:collapse;">
            <tr th:each="row : ${rows}">
                <td style="padding:6px 0;color:#6b7280;width:130px;vertical-align:top;" th:text="${row.label}">Dato</td>
                <td style="padding:6px 0;font-weight:600;" th:text="${row.value}">Valor</td>
            </tr>
        </table>

        <p th:if="${note != null}" style="margin:16px 0 0;color:#6b7280;font-size:13px;" th:text="${note}">Nota.</p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
</div>
</body>
</html>
