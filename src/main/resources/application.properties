spring.application.name=notification
server.port=${SERVER_PORT:8089}
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Gmail (SMTP). Los timeouts son importantes: por defecto Java espera sin límite.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Notificaciones: MAIL_ENABLED=false (por defecto) solo escribe los correos en el log
notification.mail.enabled=${MAIL_ENABLED:false}
notification.mail.from-name=${MAIL_FROM_NAME:Code'n Bugs Transporte}
notification.mail.from-address=${MAIL_USERNAME:}
notification.mail.smoke-test-to=${MAIL_SMOKE_TEST_TO:}


# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

notification.kafka.identity-events-topic=identity-events
notification.kafka.ticket-events-topic=ticket-events

management.endpoints.web.exposure.include=health,info